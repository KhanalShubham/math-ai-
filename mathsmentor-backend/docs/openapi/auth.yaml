openapi: 3.0.3
info:
  title: MathsMentor AI — Authentication API
  version: '1.0'
  description: >
    Authentication endpoints (Phase 4). Access tokens are short-lived JWTs
    returned in the response body; refresh tokens are opaque, rotated on
    every use, and delivered as an httpOnly cookie scoped to /api/v1/auth.
servers:
  - url: /api/v1/auth
tags:
  - name: Authentication
paths:
  /register:
    post:
      tags: [Authentication]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: httpOnly refreshToken cookie, scoped to /api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserResponse'
                  - type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /refresh:
    post:
      tags: [Authentication]
      summary: Rotate the refresh token and issue a new access token
      description: Reads the refreshToken httpOnly cookie; no request body.
      responses:
        '200':
          description: New access token issued; refresh cookie rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token
      responses:
        '204':
          description: Logged out (idempotent — succeeds even if already logged out)
  /logout-all:
    post:
      tags: [Authentication]
      summary: Revoke every refresh token for the authenticated user
      description: Use after a suspected compromise to end all sessions on all devices.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /verify-email:
    post:
      tags: [Authentication]
      summary: Verify an account's email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /request-password-reset:
    post:
      tags: [Authentication]
      summary: Request a password reset email
      description: >
        Always returns 200 with the same message regardless of whether the
        email exists, to avoid leaking which addresses have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Generic acknowledgement
  /reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password using a reset token
      description: Revokes all existing refresh tokens for the account on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Password reset
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /me:
    get:
      tags: [Authentication]
      summary: Get the authenticated principal from the access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The decoded access token payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      sub:
                        type: string
                      role:
                        type: string
        '401':
          $ref: '#/components/responses/AuthenticationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request failed schema validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationError:
      description: Invalid credentials or token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        role:
          type: string
          enum: [student, teacher, parent]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            role:
              type: string
            status:
              type: string
            emailVerifiedAt:
              type: string
              nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
